name: Build add-on images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: cadence/backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend build
        working-directory: cadence/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version and image owner
        id: ver
        run: |
          echo "version=$(grep '^version:' cadence/config.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cadence
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/cadence-${{ matrix.arch }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/cadence-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=Cadence
            io.hass.description=Daily lighting and music storyline
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
