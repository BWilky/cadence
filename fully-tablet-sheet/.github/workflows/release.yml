name: Release

on:
  release:
    types: [published]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach the card to the release
        uses: softprops/action-gh-release@v2
        with:
          files: fully-tablet-sheet.js
